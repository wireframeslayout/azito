name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type check & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Type check (server)
        run: npx -w packages/server tsc --noEmit

      - name: Type check (frontend)
        run: npx -w packages/frontend tsc --noEmit

      - name: Module dependency rules
        run: npm run depcruise

      - name: Build frontend
        run: npx -w packages/frontend vite build

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Server unit tests
        run: npx -w packages/server vitest run

  # Windows 対応（#373）の土台。tmux / POSIX シェル / mode 600 などに依存してまだ通らないテストファイルは
  # packages/server/vitest.windowsExclude.ts で理由付きで外している。対応が進むたびにそのリストを減らす。
  windows-unit:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Server unit tests
        run: npx -w packages/server vitest run --project unit

  # The agent runs on Linux x86-64 whichever OS the hub runs on, and node-pty's Linux binary can only be built on Linux. This job builds
  # the agent bundle on its own platform (checking the tarball the way verify-agent-tarball.ts does) and hands that node-pty to the jobs that
  # cross-build the bundle: a Windows hub builds the very same agent from it.
  agent-native:
    name: Agent bundle (Linux, node-pty for other hosts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build and verify the agent bundle
        run: |
          npx -w packages/server tsx scripts/build-agent.ts
          npx -w packages/server tsx scripts/verify-agent-tarball.ts packages/server/dist-agent/azito-agent.tar.gz

      - name: Collect node-pty (Linux x86-64)
        run: |
          mkdir -p node-pty-linux/build/Release
          cp node_modules/node-pty/package.json node-pty-linux/
          cp node_modules/node-pty/build/Release/pty.node node-pty-linux/build/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: node-pty-linux
          path: node-pty-linux
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: agent-bundle-linux
          path: packages/server/dist-agent

  # The agent tarball built on a Windows host, from the Linux node-pty above. Windows has no execute bit and no Linux binary of its own, so
  # this is where the bundle's modes and contents are proved: the file list, ELF pty.node, run.sh executable, as read by the hub's reader and
  # by Windows' own tar.exe. The bundle is then unpacked on Linux (agent-bundle-from-windows) and its node-pty is run.
  agent-bundle-windows:
    name: Agent bundle (built on Windows)
    runs-on: windows-latest
    needs: agent-native
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: node-pty-linux
          path: ${{ runner.temp }}/node-pty-linux

      - name: Without a Linux node-pty the build refuses instead of making a broken bundle
        run: |
          if npx -w packages/server tsx scripts/build-agent.ts > refuse.log 2>&1; then echo "build-agent must fail on a Windows host without --node-pty-linux" >&2; exit 1; fi
          grep -q "cannot run on a Linux x86-64 agent" refuse.log
          cat refuse.log | tail -n 5

      - name: Build the agent bundle on Windows
        env:
          AZITO_AGENT_NODE_PTY_LINUX: ${{ runner.temp }}/node-pty-linux
        run: npx -w packages/server tsx scripts/build-agent.ts

      - name: Verify the tarball (hub reader and Windows tar.exe)
        run: npx -w packages/server tsx scripts/verify-agent-tarball.ts packages/server/dist-agent/azito-agent.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: agent-bundle-windows
          path: packages/server/dist-agent

  agent-bundle-from-windows:
    name: Agent bundle built on Windows, run on Linux
    runs-on: ubuntu-24.04
    needs: [agent-native, agent-bundle-windows]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: agent-bundle-linux
          path: linux

      - uses: actions/download-artifact@v4
        with:
          name: agent-bundle-windows
          path: windows

      - name: Same content on both hosts
        run: |
          echo "linux:   $(cat linux/bundle-hash.txt)"
          echo "windows: $(cat windows/bundle-hash.txt)"
          test "$(cat linux/bundle-hash.txt)" = "$(cat windows/bundle-hash.txt)"

      # What buildSafeExtractCommand does on the agent host (extract with --no-same-permissions), then the two things the agent needs.
      - name: Unpack as the installer does and run node-pty from it
        run: |
          sha256sum -c <(sed 's# azito-agent.tar.gz# windows/azito-agent.tar.gz#' windows/SHA256SUMS)
          mkdir agent && tar xzf windows/azito-agent.tar.gz -C agent --no-same-owner --no-same-permissions
          test -x agent/run.sh
          cd agent
          node -e "const pty = require('./node_modules/node-pty'); const t = pty.spawn('/bin/echo', ['from-a-windows-built-bundle']); let out = ''; t.onData((d) => { out += d; }); t.onExit(() => { console.log(out.trim()); process.exit(out.includes('from-a-windows-built-bundle') ? 0 : 1); });"

  # Builds the Windows hub bundle (azito-hub-<ver>-win32-x64.zip) exactly as release.yml does, then boots it: extracts the zip and
  # starts the bundled node.exe on azito-hub.cjs, and installs it with install.ps1. No tag or release is involved, so a bundling or startup break on Windows
  # shows up on the pull request instead of at release time.
  hub-bundle-windows:
    name: Hub bundle (Windows)
    runs-on: windows-latest
    needs: agent-native
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The bundle carries the Linux agent, which needs node-pty's Linux binary (built once, in agent-native).
      - uses: actions/download-artifact@v4
        with:
          name: node-pty-linux
          path: ${{ runner.temp }}/node-pty-linux

      - name: Build the Windows hub bundle
        env:
          AZITO_AGENT_NODE_PTY_LINUX: ${{ runner.temp }}/node-pty-linux
        run: npx -w packages/server tsx scripts/build-hub.ts --version v0.0.0-ci --platform win32 --arch x64 --repo ${{ github.repository }}

      - name: Smoke-test the Windows hub bundle
        run: npx -w packages/server tsx scripts/smoke-hub-win32.ts "$(cd packages/server && ls dist-hub/azito-hub-*.zip)"

      # install.ps1 on the real Windows PowerShell 5.1 (not pwsh 7) with the zip just built, into a prefix with spaces and
      # parentheses; then the installed `azito` command, a hub started through it, and the access rules of the secret files.
      - name: Install the Windows hub bundle (install.ps1, azito.cmd, run.ps1)
        run: npx -w packages/server tsx scripts/smoke-install-win32.ts "$(cd packages/server && ls dist-hub/azito-hub-*.zip)" dist-hub/SHA256SUMS ../../install.ps1

      # The hub as a Task Scheduler task, with the real schtasks.exe: install.ps1 without -NoService registers `AzitoHub` and starts it
      # (/Run), then /api/health, `azito status`, the log, `azito stop` (no node.exe left), the Task Scheduler's own End (the hub follows
      # its conhost.exe), `azito start` and `azito service restart`. Runs after the install smoke test, which uses -NoService.
      - name: Run the Windows hub as a Task Scheduler task (install.ps1, azito start/stop/status)
        timeout-minutes: 8
        run: npx -w packages/server tsx scripts/smoke-service-win32.ts "$(cd packages/server && ls dist-hub/azito-hub-*.zip)" dist-hub/SHA256SUMS ../../install.ps1

      # The hub's own misao, with the real schtasks.exe, the bundle's misao.exe and a named pipe: install.ps1 without -NoService also
      # installs the bundled misao (task `AzitoMisao`, MISAO_SOCKET in hub\.env). Then `azito misao status`, the hub's connection to the
      # daemon (/api/system/misao, the sessions listing), `azito stop` leaving misao running, a repeated install / update that restarts
      # nothing, and `misao stop` + `azito misao start`. The tasks and the daemon are removed at the end.
      - name: Run the hub's own misao on Windows (install.ps1, azito misao, named pipe)
        timeout-minutes: 8
        run: npx -w packages/server tsx scripts/smoke-misao-win32.ts "$(cd packages/server && ls dist-hub/azito-hub-*.zip)" dist-hub/SHA256SUMS ../../install.ps1

  # The integration tests that start a real misao daemon. They run on the very binary the hub ships (the version, URL and
  # sha256 pinned in packages/server/scripts/misaoAssets.ts), so a pin that does not start, or a protocol drift, fails here.
  misao-integration:
    name: misao integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Fetch the pinned misao binary
        run: |
          BIN="$(npx -w packages/server tsx scripts/fetch-misao-binary.ts x86_64-unknown-linux-musl "$RUNNER_TEMP/misao" | tail -n 1)"
          "$BIN" --version
          echo "MISAO_CLI=$BIN" >> "$GITHUB_ENV"

      - name: Make sure tmux is available (some of the tests run beside tmux windows)
        run: command -v tmux >/dev/null || sudo apt-get install -y tmux

      - name: misao integration tests
        run: npx -w packages/server vitest run --project misao-integration

  # misao on a real Windows agent: the very Windows binary the hub ships (misao.exe, pinned in packages/server/scripts/misaoAssets.ts),
  # installed through a real agent process, started by the Task Scheduler under conhost.exe --headless, reached through the agent's
  # relay (a named pipe). The test removes its task, processes and folders and fails if any is left.
  misao-integration-windows:
    name: misao integration tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Fetch the pinned misao binary
        run: |
          $bin = npx -w packages/server tsx scripts/fetch-misao-binary.ts x86_64-pc-windows-msvc "$env:RUNNER_TEMP\misao" | Select-Object -Last 1
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "misao --version failed ($LASTEXITCODE)" }
          "MISAO_CLI=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: misao integration tests (Windows)
        run: npx -w packages/server vitest run --project misao-integration src/modules/system/misao/MisaoWindowsInstaller.misaoIntegration.test.ts

  # A Windows hub reaching an SSH server for real: the runner's own OpenSSH server over the loopback, authenticated by a key under the hub's
  # home and by the OpenSSH Authentication Agent service (named pipe), with a changed host key refused. The script puts the runner back as it
  # found it (sshd, ssh-agent, administrators_authorized_keys).
  ssh-windows:
    name: SSH from a Windows hub (sshd, ssh-agent)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: SSH key file, ssh-agent pipe and host key pinning against the local sshd
        run: npx -w packages/server tsx scripts/smoke-ssh-win32.ts

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck install.sh packages/server/scripts/run-hub.sh packages/server/scripts/download-node.sh packages/server/scripts/smoke-misao.sh
