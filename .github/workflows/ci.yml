name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type check & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Type check (server)
        run: npx -w packages/server tsc --noEmit

      - name: Type check (frontend)
        run: npx -w packages/frontend tsc --noEmit

      - name: Module dependency rules
        run: npm run depcruise

      - name: Build frontend
        run: npx -w packages/frontend vite build

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Server unit tests
        run: npx -w packages/server vitest run

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck install.sh packages/server/scripts/run-hub.sh packages/server/scripts/download-node.sh
